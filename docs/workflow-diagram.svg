<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="orangeCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="smallShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="#f1f5f9"/>
  
  <!-- Header -->
  <rect width="1400" height="100" fill="url(#headerGrad)"/>
  <text x="700" y="45" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="32" font-weight="bold">GearGuard</text>
  <text x="700" y="75" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, Arial" font-size="18">Equipment Maintenance Workflow</text>
  
  <!-- Section 1: Initial Setup Flow -->
  <g transform="translate(50, 130)">
    <text x="0" y="25" fill="#1e293b" font-family="Segoe UI, Arial" font-size="20" font-weight="bold">Step 1: System Setup</text>
    <line x1="0" y1="35" x2="200" y2="35" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- Setup cards row -->
    <g transform="translate(0, 55)">
      <!-- Company -->
      <g filter="url(#smallShadow)">
        <rect width="180" height="100" rx="12" fill="#ffffff"/>
        <rect width="180" height="8" rx="4" fill="#3b82f6"/>
        <text x="90" y="50" text-anchor="middle" font-size="28">🏢</text>
        <text x="90" y="75" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">Company Setup</text>
        <text x="90" y="92" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">Profile &amp; Settings</text>
      </g>
      
      <!-- Arrow -->
      <path d="M190 50 L230 50" stroke="#94a3b8" stroke-width="2" fill="none"/>
      <polygon points="228,45 240,50 228,55" fill="#94a3b8"/>
      
      <!-- Locations -->
      <g transform="translate(250, 0)" filter="url(#smallShadow)">
        <rect width="180" height="100" rx="12" fill="#ffffff"/>
        <rect width="180" height="8" rx="4" fill="#3b82f6"/>
        <text x="90" y="50" text-anchor="middle" font-size="28">📍</text>
        <text x="90" y="75" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">Locations</text>
        <text x="90" y="92" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">Work Areas</text>
      </g>
      
      <!-- Arrow -->
      <path d="M440 50 L480 50" stroke="#94a3b8" stroke-width="2" fill="none"/>
      <polygon points="478,45 490,50 478,55" fill="#94a3b8"/>
      
      <!-- Equipment -->
      <g transform="translate(500, 0)" filter="url(#smallShadow)">
        <rect width="180" height="100" rx="12" fill="#ffffff"/>
        <rect width="180" height="8" rx="4" fill="#22c55e"/>
        <text x="90" y="50" text-anchor="middle" font-size="28">⚙️</text>
        <text x="90" y="75" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">Equipment</text>
        <text x="90" y="92" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">Register Assets</text>
      </g>
      
      <!-- Arrow -->
      <path d="M690 50 L730 50" stroke="#94a3b8" stroke-width="2" fill="none"/>
      <polygon points="728,45 740,50 728,55" fill="#94a3b8"/>
      
      <!-- Teams -->
      <g transform="translate(750, 0)" filter="url(#smallShadow)">
        <rect width="180" height="100" rx="12" fill="#ffffff"/>
        <rect width="180" height="8" rx="4" fill="#22c55e"/>
        <text x="90" y="50" text-anchor="middle" font-size="28">👥</text>
        <text x="90" y="75" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">Teams</text>
        <text x="90" y="92" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">Create Groups</text>
      </g>
      
      <!-- Arrow -->
      <path d="M940 50 L980 50" stroke="#94a3b8" stroke-width="2" fill="none"/>
      <polygon points="978,45 990,50 978,55" fill="#94a3b8"/>
      
      <!-- Employees -->
      <g transform="translate(1000, 0)" filter="url(#smallShadow)">
        <rect width="180" height="100" rx="12" fill="#ffffff"/>
        <rect width="180" height="8" rx="4" fill="#f97316"/>
        <text x="90" y="50" text-anchor="middle" font-size="28">👨‍🔧</text>
        <text x="90" y="75" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">Technicians</text>
        <text x="90" y="92" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">Add Staff</text>
      </g>
    </g>
  </g>
  
  <!-- Arrow down to Kanban -->
  <g transform="translate(700, 305)">
    <path d="M0 0 L0 30" stroke="#3b82f6" stroke-width="3" fill="none"/>
    <polygon points="-8,28 0,42 8,28" fill="#3b82f6"/>
    <text x="15" y="25" fill="#3b82f6" font-family="Segoe UI, Arial" font-size="12" font-weight="bold">Create Maintenance Request</text>
  </g>
  
  <!-- Section 2: Kanban Board -->
  <g transform="translate(50, 360)">
    <text x="0" y="25" fill="#1e293b" font-family="Segoe UI, Arial" font-size="20" font-weight="bold">Step 2: Maintenance Lifecycle (Kanban Board)</text>
    <line x1="0" y1="35" x2="380" y2="35" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- Kanban Container -->
    <g transform="translate(0, 55)" filter="url(#shadow)">
      <rect width="1300" height="350" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      
      <!-- Stage 1: NEW -->
      <g transform="translate(25, 20)">
        <rect width="300" height="310" rx="16" fill="#eff6ff"/>
        <rect width="300" height="50" rx="16" fill="url(#blueCard)"/>
        <rect x="0" y="35" width="300" height="15" fill="url(#blueCard)"/>
        <text x="150" y="35" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="18" font-weight="bold">📥 NEW</text>
        
        <!-- Card inside -->
        <g transform="translate(20, 70)">
          <rect width="260" height="90" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
          <circle cx="35" cy="45" r="25" fill="#dbeafe"/>
          <text x="35" y="52" text-anchor="middle" fill="#2563eb" font-family="Segoe UI, Arial" font-size="20" font-weight="bold">1</text>
          <text x="155" y="35" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">Request Created</text>
          <text x="155" y="55" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Issue reported</text>
          <text x="155" y="75" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Awaiting assignment</text>
        </g>
        
        <!-- Priority info -->
        <g transform="translate(20, 175)">
          <rect width="260" height="115" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
          <text x="130" y="25" text-anchor="middle" fill="#92400e" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Priority Levels</text>
          <circle cx="45" cy="50" r="8" fill="#22c55e"/><text x="70" y="55" fill="#1e293b" font-family="Segoe UI, Arial" font-size="12">Low</text>
          <circle cx="145" cy="50" r="8" fill="#eab308"/><text x="170" y="55" fill="#1e293b" font-family="Segoe UI, Arial" font-size="12">Medium</text>
          <circle cx="45" cy="80" r="8" fill="#f97316"/><text x="70" y="85" fill="#1e293b" font-family="Segoe UI, Arial" font-size="12">High</text>
          <circle cx="145" cy="80" r="8" fill="#ef4444"/><text x="170" y="85" fill="#1e293b" font-family="Segoe UI, Arial" font-size="12">Urgent</text>
          <circle cx="45" cy="105" r="8" fill="#dc2626"/><text x="70" y="110" fill="#1e293b" font-family="Segoe UI, Arial" font-size="12">Critical</text>
        </g>
      </g>
      
      <!-- Arrow -->
      <g transform="translate(335, 175)">
        <path d="M0 0 L50 0" stroke="#64748b" stroke-width="3" stroke-dasharray="8,4"/>
        <polygon points="48,-8 65,0 48,8" fill="#64748b"/>
      </g>
      
      <!-- Stage 2: IN PROGRESS -->
      <g transform="translate(350, 20)">
        <rect width="300" height="310" rx="16" fill="#fff7ed"/>
        <rect width="300" height="50" rx="16" fill="url(#orangeCard)"/>
        <rect x="0" y="35" width="300" height="15" fill="url(#orangeCard)"/>
        <text x="150" y="35" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="18" font-weight="bold">🔧 IN PROGRESS</text>
        
        <!-- Card inside -->
        <g transform="translate(20, 70)">
          <rect width="260" height="90" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
          <circle cx="35" cy="45" r="25" fill="#ffedd5"/>
          <text x="35" y="52" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, Arial" font-size="20" font-weight="bold">2</text>
          <text x="155" y="35" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">Work In Progress</text>
          <text x="155" y="55" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Technician assigned</text>
          <text x="155" y="75" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Actively working</text>
        </g>
        
        <!-- Types info -->
        <g transform="translate(20, 175)">
          <rect width="260" height="115" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
          <text x="130" y="25" text-anchor="middle" fill="#1e40af" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Maintenance Types</text>
          <text x="20" y="50" fill="#1e3a8a" font-family="Segoe UI, Arial" font-size="11">• Preventive</text>
          <text x="140" y="50" fill="#1e3a8a" font-family="Segoe UI, Arial" font-size="11">• Corrective</text>
          <text x="20" y="72" fill="#1e3a8a" font-family="Segoe UI, Arial" font-size="11">• Inspection</text>
          <text x="140" y="72" fill="#1e3a8a" font-family="Segoe UI, Arial" font-size="11">• Calibration</text>
          <text x="20" y="94" fill="#1e3a8a" font-family="Segoe UI, Arial" font-size="11">• Emergency</text>
          <text x="140" y="94" fill="#1e3a8a" font-family="Segoe UI, Arial" font-size="11">• Predictive</text>
        </g>
      </g>
      
      <!-- Arrow -->
      <g transform="translate(660, 175)">
        <path d="M0 0 L50 0" stroke="#64748b" stroke-width="3" stroke-dasharray="8,4"/>
        <polygon points="48,-8 65,0 48,8" fill="#64748b"/>
      </g>
      
      <!-- Stage 3: REPAIRED -->
      <g transform="translate(675, 20)">
        <rect width="300" height="310" rx="16" fill="#f0fdf4"/>
        <rect width="300" height="50" rx="16" fill="url(#greenCard)"/>
        <rect x="0" y="35" width="300" height="15" fill="url(#greenCard)"/>
        <text x="150" y="35" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="18" font-weight="bold">✅ REPAIRED</text>
        
        <!-- Card inside -->
        <g transform="translate(20, 70)">
          <rect width="260" height="90" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
          <circle cx="35" cy="45" r="25" fill="#dcfce7"/>
          <text x="35" y="52" text-anchor="middle" fill="#16a34a" font-family="Segoe UI, Arial" font-size="20" font-weight="bold">3</text>
          <text x="155" y="35" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">Repair Complete</text>
          <text x="155" y="55" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Issue resolved</text>
          <text x="155" y="75" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Equipment operational</text>
        </g>
        
        <!-- Outcome info -->
        <g transform="translate(20, 175)">
          <rect width="260" height="115" rx="10" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
          <text x="130" y="25" text-anchor="middle" fill="#065f46" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Outcomes</text>
          <text x="130" y="55" text-anchor="middle" fill="#047857" font-family="Segoe UI, Arial" font-size="13">✓ Equipment Fixed</text>
          <text x="130" y="80" text-anchor="middle" fill="#047857" font-family="Segoe UI, Arial" font-size="13">✓ Back in Service</text>
          <text x="130" y="105" text-anchor="middle" fill="#047857" font-family="Segoe UI, Arial" font-size="13">✓ Ready for Production</text>
        </g>
      </g>
      
      <!-- Arrow -->
      <g transform="translate(985, 175)">
        <path d="M0 0 L50 0" stroke="#64748b" stroke-width="3" stroke-dasharray="8,4"/>
        <polygon points="48,-8 65,0 48,8" fill="#64748b"/>
      </g>
      
      <!-- Stage 4: SCRAP -->
      <g transform="translate(1000, 20)">
        <rect width="275" height="310" rx="16" fill="#fef2f2"/>
        <rect width="275" height="50" rx="16" fill="url(#redCard)"/>
        <rect x="0" y="35" width="275" height="15" fill="url(#redCard)"/>
        <text x="137" y="35" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="18" font-weight="bold">🗑️ SCRAP</text>
        
        <!-- Card inside -->
        <g transform="translate(20, 70)">
          <rect width="235" height="90" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
          <circle cx="35" cy="45" r="25" fill="#fee2e2"/>
          <text x="35" y="52" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, Arial" font-size="20" font-weight="bold">4</text>
          <text x="140" y="35" text-anchor="middle" fill="#1e293b" font-family="Segoe UI, Arial" font-size="14" font-weight="bold">End of Life</text>
          <text x="140" y="55" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Beyond repair</text>
          <text x="140" y="75" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="12">Not economical to fix</text>
        </g>
        
        <!-- Status info -->
        <g transform="translate(20, 175)">
          <rect width="235" height="115" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
          <text x="117" y="25" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Final Status</text>
          <text x="117" y="55" text-anchor="middle" fill="#b91c1c" font-family="Segoe UI, Arial" font-size="13">✗ Equipment Unusable</text>
          <text x="117" y="80" text-anchor="middle" fill="#b91c1c" font-family="Segoe UI, Arial" font-size="13">✗ Decommissioned</text>
          <text x="117" y="105" text-anchor="middle" fill="#b91c1c" font-family="Segoe UI, Arial" font-size="13">✗ Marked for Disposal</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Section 3: Supporting Features -->
  <g transform="translate(50, 790)">
    <text x="0" y="25" fill="#1e293b" font-family="Segoe UI, Arial" font-size="20" font-weight="bold">Supporting Features</text>
    <line x1="0" y1="35" x2="180" y2="35" stroke="#3b82f6" stroke-width="3"/>
    
    <g transform="translate(0, 50)">
      <g filter="url(#smallShadow)">
        <rect width="200" height="45" rx="8" fill="#1e293b"/>
        <text x="30" y="30" fill="#60a5fa" font-family="Segoe UI, Arial" font-size="18">📊</text>
        <text x="115" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Dashboard</text>
      </g>
      
      <g transform="translate(220, 0)" filter="url(#smallShadow)">
        <rect width="200" height="45" rx="8" fill="#1e293b"/>
        <text x="30" y="30" fill="#4ade80" font-family="Segoe UI, Arial" font-size="18">🔔</text>
        <text x="115" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Notifications</text>
      </g>
      
      <g transform="translate(440, 0)" filter="url(#smallShadow)">
        <rect width="200" height="45" rx="8" fill="#1e293b"/>
        <text x="30" y="30" fill="#facc15" font-family="Segoe UI, Arial" font-size="18">📅</text>
        <text x="115" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Scheduling</text>
      </g>
      
      <g transform="translate(660, 0)" filter="url(#smallShadow)">
        <rect width="200" height="45" rx="8" fill="#1e293b"/>
        <text x="30" y="30" fill="#f472b6" font-family="Segoe UI, Arial" font-size="18">📝</text>
        <text x="115" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Tasks</text>
      </g>
      
      <g transform="translate(880, 0)" filter="url(#smallShadow)">
        <rect width="200" height="45" rx="8" fill="#1e293b"/>
        <text x="30" y="30" fill="#a78bfa" font-family="Segoe UI, Arial" font-size="18">📋</text>
        <text x="115" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Work Orders</text>
      </g>
      
      <g transform="translate(1100, 0)" filter="url(#smallShadow)">
        <rect width="200" height="45" rx="8" fill="#1e293b"/>
        <text x="30" y="30" fill="#22d3ee" font-family="Segoe UI, Arial" font-size="18">⚙️</text>
        <text x="115" y="30" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial" font-size="13" font-weight="bold">Settings</text>
      </g>
    </g>
  </g>
</svg>
